[[mods]]
modId = "aiadmin"
version = "${version}"
displayName = "AI 管理机器人"
authors = "AFT-Sakee01"
description = '''
服务端 AI 管理员：接入 GPT / Claude / DeepSeek / Antigravity（官方或中转 API），能查看服务器的一切信息，
但只能通过后台指令和聊天影响服务器。定时巡检、事件唤醒、管理员 /aibot 提问；权限/额度/启停规则、余额监控、上下文压缩。
只需装在服务端，玩家不用装。
'''
# 只在服务端：客户端不需要安装，也不影响进服
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.aiadmin]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

